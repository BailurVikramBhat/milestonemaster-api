spring:
  application:
    name: ${SPRING_APP_NAME:milestonemaster}
server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: []
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Authorization
      - X-Requested-With
      - Accept
    allow-credentials: true
  auth:
    cookie:
      name: MM_AUTH
      path: /
      http-only: true
      secure: false
      same-site: Lax
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}

logging:
  level:
    root: INFO
    com.vikrambhat.milestonemaster: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %magenta([%X{requestId:-no-request-id}]) %yellow(%logger{36}) - %msg%n}
