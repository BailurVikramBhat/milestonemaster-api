spring:
  application:
    name: milestonemaster
server:
  port: 8080

app:
  cors:
    allowed-origins: []
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Content-Type
      - Authorization
      - X-Requested-With
      - Accept
    allow-credentials: true
  auth:
    cookie:
      name: MM_AUTH
      path: /
      http-only: true
      secure: false
      same-site: Lax
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}