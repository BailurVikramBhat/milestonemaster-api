name: Backend CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - "release/**"

jobs:
  backend-checks:
    name: Lint, build, and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Validate Maven project
        run: mvn -B -DskipTests validate

      - name: Build backend jar
        run: mvn -B -DskipTests package

      - name: Run unit tests and coverage gate
        run: mvn -B clean verify

  docker-checks:
    name: Build image and validate Compose profiles
    runs-on: ubuntu-latest
    needs: backend-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t milestonemaster-api:ci .

      - name: Validate test Compose profile
        run: docker compose --profile test config

      - name: Validate preprod Compose profile
        run: docker compose --profile preprod config

      - name: Validate prod Compose profile
        run: docker compose --profile prod config
