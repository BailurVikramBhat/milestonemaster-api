name: Backend Deploy

on:
  push:
    branches:
      - develop
      - main
      - "release/**"

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-environment:
    name: Select deployment target
    runs-on: ubuntu-latest
    outputs:
      compose_profile: ${{ steps.target.outputs.compose_profile }}
      environment_name: ${{ steps.target.outputs.environment_name }}
      backend_port: ${{ steps.target.outputs.backend_port }}
    steps:
      - name: Map branch to environment
        id: target
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            develop)
              echo "compose_profile=test" >> "$GITHUB_OUTPUT"
              echo "environment_name=test" >> "$GITHUB_OUTPUT"
              echo "backend_port=8081" >> "$GITHUB_OUTPUT"
              ;;
            release/*)
              echo "compose_profile=preprod" >> "$GITHUB_OUTPUT"
              echo "environment_name=preprod" >> "$GITHUB_OUTPUT"
              echo "backend_port=8082" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "compose_profile=prod" >> "$GITHUB_OUTPUT"
              echo "environment_name=production" >> "$GITHUB_OUTPUT"
              echo "backend_port=8083" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deployment branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

  deploy:
    name: Deploy ${{ needs.select-environment.outputs.environment_name }}
    runs-on: ubuntu-latest
    needs: select-environment
    environment: ${{ needs.select-environment.outputs.environment_name }}
    env:
      COMPOSE_PROFILE: ${{ needs.select-environment.outputs.compose_profile }}
      BACKEND_PORT: ${{ needs.select-environment.outputs.backend_port }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use fallback JWT secret for local-only deployment validation
        if: env.JWT_SECRET == ''
        run: echo "JWT_SECRET=yLv6eDrWu33nuC7WpXz+N7wJsmCxTe+5++fmW6vgha9HQhBFcHUOJkimNhpRI28co4+Dhi9X1K+9fPjKKknA2A==" >> "$GITHUB_ENV"

      - name: Validate JWT secret is Base64
        shell: bash
        run: python3 -c "import base64, os; base64.b64decode(os.environ['JWT_SECRET'], validate=True)"

      - name: Deploy Compose profile
        run: docker compose --profile "$COMPOSE_PROFILE" up -d --build

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in {1..36}; do
            if curl -fsS "http://localhost:${BACKEND_PORT}/actuator/health"; then
              exit 0
            fi
            sleep 5
          done

          docker compose --profile "$COMPOSE_PROFILE" logs
          exit 1

      - name: Tear down local deployment
        if: always()
        run: docker compose --profile "$COMPOSE_PROFILE" down -v
